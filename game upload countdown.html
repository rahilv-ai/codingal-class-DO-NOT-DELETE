<!DOCTYPE html>
<html>

<head>
    <title>My Game Upload Countdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ffecd2, #fcb69f);
            text-align: center;
        }

        .card {
            width: 90%;
            max-width: 480px;
            background: white;
            border: 4px solid #17a8e6;
            border-radius: 20px;
            margin: 30px auto;
            padding: 20px;
        }

        h1 {
            color: #a569ff;
        }

        button {
            background: #7d69ff;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }

        .box {
            background: rgb(200, 200, 237);
            border: 2px dashed #9a8bff;
            border-radius: 12px;
            padding: 10px;
            margin-top: 12px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>🎮 My Game Upload Countdown</h1>
        <button onclick="checkCountdown()">Check Countdown</button>
        <div class="box">
            <h3>Game Story</h3>
            <p id="story"></p>
        </div>
        <div class="box">
            <h3>Greeting</h3>
            <p id="greeting"></p>
        </div>
        <div class="box">
            <h3>Days Left</h3>
            <p id="days"></p>
        </div>
        <div class="box">
            <h3>Countdown</h3>
            <p id="countdown"></p>
        </div>
    </div>
    <script>
        function checkCountdown() {
            let cakeFlavour;
            let giftIdea = null;
            let friendName = "Zara";
            let daysleft = 3;

            document.getElementById("story").innerHTML = giftIdea + cakeFlavour;
            
            
            let hour = new Date().getHours();
            let greeting;
            if (hour < 12) {
                greeting = "Good Morning!"
            } else if (hour < 17) {
                greeting = "Good Afternoon!"
            } else if (hour < 20) {
                greeting = "Good Evening"
            } else {
                greeting = "Good Night"
            }
            document.getElementById("greeting").innerHTML = greeting

            let message;

            if (daysleft == 0) {
                message = "today the countdown starts";
            } else if (daysleft == 1) {
                message = "tommorow the countdown starts";
            } else {
                message = daysleft + " days to go"
            }
            
            document.getElementById("days").innerHTML = message;

            let countdown = "";
            let count = daysleft;

            while (count >= 1) {
                countdown += " days left = " + count;
                count--;
            }
            countdown += "Game Time";

            document.getElementById("countdown").innerHTML = countdown;
            }
    </script>
</body>

</html>
