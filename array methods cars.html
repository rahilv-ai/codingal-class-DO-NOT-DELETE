<!DOCTYPE html>
<html>
    <head>
        <title>array method cars</title>
    </head>
    <body>
        <h2>array methods are the best array methods for methoding the methods, thats why arrays are used with different methods or else the methods would be called methods.</h2>

        <p id="join"></p>
        <p id="original"></p>
        <p id="pop"></p>

        <br>

        <script>
            var cars = ["lamborghini", "buggati", "limousine", "bmw", "toyota"]
            document.getElementById("join").innerHTML = cars.join(" * ");
            document.getElementById("original").innerHTML = cars;
            cars.pop();
            document.getElementById("pop").innerHTML = cars;
            
        </script>
    </body>
</html>
