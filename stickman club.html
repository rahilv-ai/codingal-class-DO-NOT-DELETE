<!DOCTYPE html>
<html>

<head>
    <title>School Club Website</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: #aa12b2;
        }

        .club-card {
            text-align: center;
            border: 2px solid #2694e9b9;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }

        .club-card h3 {
            color: #af23e2;
        }
    </style>
</head>

<body>

    <h1>Stickman Clubs</h1>

    <div class="container">

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>coding club</h3>
                    <p>here we make stickman games and improve it to make the best game in the world</p>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>training Club</h3>
                    <p>here we train to become stronger stickmen</p>
                </div>
            </div>

            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h3>power Club</h3>
                    <p>here we learn how to use weapons and use their abilities on their weapon</p>
                </div>
            </div>

        </div>
    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>

</body>

</html>
