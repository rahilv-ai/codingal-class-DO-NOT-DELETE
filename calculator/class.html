<!DOCTYPE html>
<html>
    <head>
        <title>
            this is calculator
        </title>
    </head>
    <body>
        <h2>this is just a smart smartulator</h2>
        <p id="result"></p>
        <script>
            function add(a, b) {
                return a + b;
            }

            function average(a, b) {
                return add(a, b) / 2;
            }
            let result = average(167, 761)
            document.getElementById("result").innerHTML = result;
        </script>
    </body>
</html>
