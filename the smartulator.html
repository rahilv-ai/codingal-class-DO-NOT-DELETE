<!DOCTYPE html>
<html>
    <head>
        <title>Simple Calculator</title>
    </head>
    <body>
        <h1>the smartulator</h1>
        <p>the smartest and latest smartulator</p>
        <p id="add"></p>
        <p id="sub"></p>
        <p id="mul"></p>
        <p id="div"></p>

        <script>
            var num1 = 10;
            var num2 = 2;

            var add = num1 + num2;
            var sub = num1 - num2;
            var mul = num1 * num2;
            var div = num1 / num2;

            document.getElementById("add").innerText = "Addition: " + add;
            document.getElementById("sub").innerText = "Subtraction: " + sub;
            document.getElementById("mul").innerText = "Multiplication: " + mul;
            document.getElementById("div").innerText = "division: " + div;
        </script>
    </body>
</html>
