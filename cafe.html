<!DOCTYPE html>
<html>

<head>
    <title>My cafe</title>

    <style>
          {
            box-sizing: border-box;
        }

        body {
            font-family: Georgia, serif;
            background-color: #fff8e7;
            color: #3b2f2f;
        }

        .menu-card {
            width: 600px;
            border: 3px solid #8b4513;
            border-radius: 15px;
            background-color: #ffffff;
            box-shadow: 0 0 20px #8b4513;
        }

        .cafe-name {
            font-size: 42px;
            font-weight: bold;
            color: #8b0000;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px #d2b48c;
        }

        .tagline {
            font-size: 18px;
            font-style: italic;
            text-align: center;
            color: #6b4226;
            text-decoration: underline;
        }

        .menu-section {
            border: 2px solid #d2b48c;
            box-shadow: 0 0 8px #d2b48c;
        }

        .section-title {
            font-size: 26px;
            color: #a0522d;
            text-transform: capitalize;
            text-decoration: overline;
        }

        .drink-name {
            font-size: 20px;
            font-weight: bold;
            color: #4b0082;
            text-transform: capitalize;
        }

        .drink-name:hover {
            transform: scale(1.1);
        }

        .drink-description {
            font-size: 15px;
            line-height: 1.6;
            text-indent: 30px;
            color: #555555;
        }

        .special-offer {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            background-color: #b22222;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 2px 2px 3px #000000;
            box-shadow: 0 0 12px #b22222;
            transform: rotate(-2deg);
        }
    </style>
</head>

<body>

    <div class="menu-card">

        <h1 class="cafe-name">Tasty Treat Cafe</h1>

        <p class="tagline">Fresh food, happy mood!</p>

        <div class="menu-section">
            <h2 class="section-title">natural</h2>

            <p class="drink-name">water</p>
            <p class="drink-description">
                a tasty natural liquid substance
            </p>

            <p class="drink-name">cold water</p>
            <p class="drink-description">
                a tasty natural liquid substance cooled for extra freshness
            </p>
        </div>

        <div class="menu-section">
            <h2 class="section-title">sodas</h2>

            <p class="drink-name">cola</p>
            <p class="drink-description">
                a sweet and sparkling soda
            </p>

            <p class="drink-name">soda of the year</p>
            <p class="drink-description">
                all of your favorite drinks mixed into 1 soda
            </p>
        </div>

        <p class="special-offer">Weekend special: 20% off!</p>

    </div>

</body>

</html>
