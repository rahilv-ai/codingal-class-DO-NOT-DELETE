<!DOCTYPE html>
<html>
    <head>
        <title>Loops in JavaScript</title>
    </head>
    <body>
        <h2>Loops in JavaScript</h2>
        <p id="demo"></p>
        <script>
            var fruits = ["apple", "banana", "orange", "mango", "watermelon"];
            var fru = "";
            var i;

            for (i = 0; i < fruits.length; i++) {
                fru += fruits[i] + "<br>";
            }
            document.getElementById("demo").innerHTML = fru;
            </script>
    </body>
</html>
